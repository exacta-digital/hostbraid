[workspace]
resolver = "3"
members = [
  "crates/hostbraid-cli",
  "crates/hostbraid-core",
]
default-members = ["crates/hostbraid-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
homepage = "https://itsed.se"
publish = false

[workspace.dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
console = "0.16"
indicatif = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
