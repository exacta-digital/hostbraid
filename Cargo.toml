[workspace]
resolver = "3"
members = [
  "crates/hostbraid-cli",
  "crates/hostbraid-core",
  "crates/hostbraid-provider-kinsta",
]
default-members = ["crates/hostbraid-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
homepage = "https://itsed.se"
publish = false

[workspace.dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
command-group = "5.0.1"
console = "0.16"
fs2 = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
indicatif = "0.18"
humantime = "2"
rpassword = "7.4"
rustix = { version = "1", features = ["fs", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = { version = "0.3", default-features = false }
strsim = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
